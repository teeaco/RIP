<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Степени оксигенации | Список услуг</title>
    <link rel="stylesheet" href="/static/styles/style.css?v=20260311-1">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    {{template "header" .}}

    <div class="top-tools">
        {{if .HasDraft}}
        <a href="/oxygenation_request/{{.RequestID}}" class="cart-icon-link" aria-label="Открыть заявку #{{.RequestID}}" data-request-id="{{.RequestID}}" data-cart-count="{{.CartCount}}">
            <span class="cart-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3.5c-2.8 4.2-6 7.3-6 10.6A6 6 0 0 0 12 20a6 6 0 0 0 6-5.9c0-3.3-3.2-6.4-6-10.6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                    <path d="M9 13.2h1.7l1.1-2 1.2 3 1-1.6H15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
            <span class="cart-badge">{{.CartCount}}</span>
        </a>
        {{else}}
        <span class="cart-icon-link cart-icon-link-disabled" aria-disabled="true" title="Черновик появится после добавления услуги">
            <span class="cart-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3.5c-2.8 4.2-6 7.3-6 10.6A6 6 0 0 0 12 20a6 6 0 0 0 6-5.9c0-3.3-3.2-6.4-6-10.6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                    <path d="M9 13.2h1.7l1.1-2 1.2 3 1-1.6H15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
            <span class="cart-badge">0</span>
        </span>
        {{end}}
    </div>

    <form action="/services" method="GET" class="search-container">
        <input type="text" name="query" class="search-input" placeholder="Поиск..." value="{{.Query}}">
        <button type="submit" class="search-btn">Поиск</button>
    </form>

    <main class="container">
        <h1 class="page-title">Степени оксигенации</h1>

        <div class="cards-grid">
            {{range .Services}}
            <article class="card" data-service-id="{{.ID}}" data-request-id="{{$.RequestID}}" data-image-url="{{.ImageURL}}" data-video-url="{{.VideoURL}}">
                <a href="/services/{{.ID}}" class="card-link">
                    <div class="card-image">
                        <img src="{{.ImageURL}}" alt="{{.Name}}">
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">{{.Name}}</h3>
                        <p class="card-index">{{.Benchmark}}</p>
                        <p class="card-desc">{{.Description}}</p>
                    </div>
                </a>
                <form action="/oxygenation_request/add-service" method="POST" class="card-action">
                    <input type="hidden" name="service_id" value="{{.ID}}">
                    <input type="hidden" name="return_to" value="/services{{if $.Query}}?query={{$.Query}}{{end}}">
                    <button type="submit" class="btn-add">Добавить</button>
                </form>
            </article>
            {{else}}
            <p class="empty-state">По вашему запросу ничего не найдено.</p>
            {{end}}
        </div>
    </main>
</body>
</html>
