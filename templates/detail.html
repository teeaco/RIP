<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Service.Name}} | Карточка услуги</title>
    <link rel="stylesheet" href="/static/styles/style.css?v=20260322-1">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="portrait-mode">
    {{template "header" .}}

    <main class="container detail-page">
        <section class="detail-hero-card">
            <video autoplay muted loop playsinline class="detail-hero-video">
                <source src="{{.Service.VideoURL}}" type="video/mp4">
                Ваш браузер не поддерживает видео.
            </video>
            <div class="detail-hero-overlay">
                <h1 class="detail-title">{{.Service.Name}}</h1>
                <p class="detail-index">{{.Service.Benchmark}}</p>
                <p class="detail-hero-caption">{{.Service.ShortDescription}}</p>
            </div>
        </section>

        <section class="content-wrapper detail-info-card">
            <div class="detail-preview">
                <img src="{{.Service.ImageURL}}" alt="{{.Service.Name}}">
            </div>

            <div class="detail-section">
                <h2 class="section-title">Краткое описание</h2>
                <p class="detail-text">{{.ShortText}}</p>
            </div>

            <div class="detail-section">
                <h2 class="section-title">Рекомендация врача</h2>
                <p class="detail-text">{{.DoctorAdvice}}</p>
            </div>
        </section>
    </main>
</body>
</html>
