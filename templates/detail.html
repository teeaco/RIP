<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Service.Name}} | Карточка услуги</title>
    <link rel="stylesheet" href="/static/styles/style.css?v=20260322-4">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="portrait-mode">
    {{template "header" .}}

    <video autoplay muted loop class="background-video">
        <source src="{{.Service.VideoURL}}" type="video/mp4">
        Ваш браузер не поддерживает видео.
    </video>

    <div class="content-container">
        <div class="content-wrapper">
            <div class="detail-preview">
                <img src="{{.Service.ImageURL}}" alt="{{.Service.Name}}">
            </div>

            <h1 class="detail-title">{{.Service.Name}}</h1>
            <p class="detail-index">{{.Service.Benchmark}}</p>
            <form action="/oxygenation_request/add-service" method="POST" class="detail-add-form">
                <input type="hidden" name="service_id" value="{{.Service.ID}}">
                <input type="hidden" name="return_to" value="/services/{{.Service.ID}}">
                <button type="submit" class="btn-add btn-add-detail">Добавить</button>
            </form>

            <div class="detail-section">
                <h2 class="section-title">Описание</h2>
                <p class="detail-text">{{.Service.Description}}</p>
            </div>

            <div class="detail-section">
                <h2 class="section-title">Рекомендация врача</h2>
                <p class="detail-text">{{.DoctorAdvice}}</p>
            </div>
        </div>
    </div>
</body>
</html>
